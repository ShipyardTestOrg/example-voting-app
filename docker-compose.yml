# Generated by curious
services:
  vote:
    build:
      context: vote
      target: dev
    volumes:
      - ./vote:/usr/local/app
    env_file:
      - ./.env
    ports:
      - 8080:80
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
      shipyard.readiness.http.path: /
  result:
    build: result
    entrypoint: nodemon --inspect=0.0.0.0 server.js
    volumes:
      - ./result:/usr/local/app
    env_file:
      - ./.env
    environment:
      PORT: "80"
    ports:
      - 8081:80
      - 127.0.0.1:9229:9229
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      shipyard.route: /result
      shipyard.readiness.http.path: /
  worker:
    build:
      context: worker
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  redis:
    image: redis:alpine
    env_file:
      - ./.env
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "6379"
  db:
    image: postgres:15-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "5432"
  seed:
    build: seed-data
    env_file:
      - ./.env
    depends_on:
      vote:
        condition: service_healthy
volumes:
  db-data:
    labels:
      shipyard.deploy.disk.size: 5Gi
